<div class="related-links-box">
  <p class="related-links-superheader">General Parking</p>
  <hr class="related-links-divider" />

  <div class="related-links-grid">
    <a class="related-link" *ngFor="let link of links" [routerLink]="link.route">
      <span class="related-link-chevron">&raquo;</span><span class="related-link-label">{{ link.label }}</span>
    </a>
  </div>
</div>
